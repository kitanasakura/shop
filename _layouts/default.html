<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  <script>window.BASE = "{{ site.baseurl }}";</script>
</head>
<body data-page="{{ page.slug }}">
  <div id="announce" class="announce"></div>
  <header id="header" class="header"></header>
  <main id="app" class="app">{{ content }}</main>
  <footer id="footer" class="footer"></footer>

  <div id="cart-scrim" class="scrim" hidden></div>
  <aside id="cart" class="cart" aria-label="Shopping cart" hidden></aside>
  <div id="modal" class="modal" hidden></div>

  <script src="{{ site.baseurl }}/assets/js/spec-parser.js"></script>
  <script src="{{ site.baseurl }}/assets/js/app.js"></script>
</body>
</html>
